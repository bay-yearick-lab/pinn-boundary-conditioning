name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  numerical-validation:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install CPU dependencies
        run: python -m pip install "numpy>=1.26" "scipy>=1.11" "matplotlib>=3.8" "pytest>=8"
      - name: Exact-law and reported-result tests
        run: python -m pytest -q tests
      - name: Verification scripts (exact linear laws, held-out diagnostic)
        env:
          PYTHONPATH: src
        run: |
          python src/verify_statics.py
          python src/verify_dynamics.py
          python src/verify_ushape.py
          python src/verify_exact_laws.py
          python src/exp_diagnostic_holdout.py
      - name: Headline numbers from data/
        run: python scripts/headline.py
      - name: Figures regenerate from data/
        run: python scripts/make_figures.py
